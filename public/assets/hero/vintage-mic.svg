  <line x1="98" y1="120" x2="142" y2="120" stroke="#1C1713" stroke-width="2.5"/>
  <line x1="98" y1="135" x2="142" y2="135" stroke="#1C1713" stroke-width="2.5"/>
  <line x1="98" y1="150" x2="142" y2="150" stroke="#1C1713" stroke-width="2.5"/>
  <line x1="98" y1="165" x2="142" y2="165" stroke="#1C1713" stroke-width="2.5"/>
  <!-- Orange Center Indicator Pill -->
  <circle cx="120" cy="92" r="4" fill="#F26A1B"/>
</svg>