  <line x1="120" y1="330" x2="120" y2="220" stroke="#1C1713" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="220" r="12" fill="#E6D8C3" stroke="#1C1713" stroke-width="3"/>
